<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Workflow Orchestrator</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f5f6f8;
      --panel: #fff;
      --line: #d7dae0;
      --text: #20242b;
      --muted: #69717d;
      --accent: #2368d8;
      --accent-soft: #eaf1ff;
      --danger: #b42318;
      --shadow: 0 2px 10px #17203312;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191d;
        --panel: #22252a;
        --line: #3b3f47;
        --text: #f1f3f5;
        --muted: #aab0ba;
        --accent: #75a7ff;
        --accent-soft: #263853;
        --danger: #ff8a80;
        --shadow: 0 2px 10px #0005;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px;
      background: var(--panel); color: var(--text); cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .primary { color: white; background: #2368d8; border-color: #2368d8; }
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    h1 { margin: 0; font-size: 17px; white-space: nowrap; }
    .workflow-heading { min-width: 0; }
    #workflowLabel { margin-top: 2px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .toolbar { display: flex; gap: 7px; flex-wrap: wrap; }
    #status { margin-left: auto; color: var(--muted); text-align: right; min-width: 180px; }
    #status.error { color: var(--danger); }
    main {
      --outline-width: 260px;
      min-height: 0; flex: 1; display: grid;
      grid-template-columns: var(--outline-width) minmax(0, 1fr) 300px; gap: 10px; padding: 10px;
    }
    main.resizing { cursor: col-resize; user-select: none; }
    main.json-visible { grid-template-rows: minmax(0, 1fr) minmax(260px, .65fr); }
    .panel {
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow);
    }
    .panel-title { margin: 0; padding: 11px 12px; font-size: 14px; border-bottom: 1px solid var(--line); }
    .scroll { min-height: 0; overflow: auto; padding: 10px; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
    label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    textarea {
      width: 100%; resize: vertical; border: 1px solid var(--line); border-radius: 7px;
      padding: 8px; background: var(--bg); color: var(--text);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #varsEditor { min-height: 112px; }
    #jsonEditor { flex: 1; resize: none; border: 0; border-radius: 0; padding: 12px; }
    .json-actions { display: flex; gap: 7px; padding: 9px; border-top: 1px solid var(--line); }
    .json-panel[hidden] { display: none; }
    .outline-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; padding: 9px; border-bottom: 1px solid var(--line); }
    .outline-panel { position: relative; }
    .outline-resizer {
      position: absolute; z-index: 2; top: 8px; right: -6px; bottom: 8px; width: 12px;
      cursor: col-resize; touch-action: none;
    }
    .outline-resizer::before {
      content: ''; position: absolute; inset: 0 auto 0 5px; width: 2px; border-radius: 2px;
      background: transparent;
    }
    .outline-resizer:hover::before,
    .outline-resizer:focus-visible::before,
    main.resizing .outline-resizer::before { background: var(--accent); }
    .outline-tools input, .scope-add select {
      min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px;
      background: var(--bg); color: var(--text);
    }
    .outline-list, .outline-list ul { margin: 0; padding: 0; list-style: none; }
    .outline-list ul { margin-left: 15px; padding-left: 7px; border-left: 1px solid var(--line); }
    .outline-row { display: flex; align-items: center; gap: 4px; min-width: 0; border-radius: 6px; }
    .outline-row.selected { background: var(--accent-soft); }
    .outline-disclosure, .outline-spacer { width: 24px; height: 26px; flex: 0 0 24px; padding: 0; border: 0; background: transparent; }
    .outline-disclosure { display: inline-grid; place-items: center; }
    .outline-disclosure svg { display: block; width: 14px; height: 14px; pointer-events: none; }
    .outline-spacer { display: inline-block; }
    .outline-node, .outline-branch, .outline-vars {
      min-width: 0; flex: 1; padding: 5px 4px; border: 0; background: transparent; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .outline-branch { color: var(--muted); font-size: 12px; }
    .outline-count { flex: 0 0 auto; padding-right: 5px; color: var(--muted); font-size: 11px; }
    .outline-path { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
    .search-result { display: block; width: 100%; padding: 6px; border-radius: 6px; }
    .search-result:hover { background: var(--accent-soft); }
    .scope-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .breadcrumbs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
    .breadcrumb { padding: 2px 4px; border: 0; background: transparent; white-space: nowrap; color: var(--muted); }
    .breadcrumb:last-child { color: var(--text); font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb-separator { color: var(--muted); }
    .scope-add { display: flex; gap: 6px; flex: 0 0 auto; }
    #canvas { min-height: 100%; }
    .step-list { display: flex; flex-direction: column; gap: 5px; }
    .step {
      border: 1px solid var(--line); border-left: 4px solid var(--step-color, var(--accent));
      border-radius: 7px; padding: 6px; background: var(--panel);
    }
    .step.selected { box-shadow: 0 0 0 2px var(--accent); }
    .step[data-type="assign"] { --step-color: #38bdf8; }
    .step[data-type="while"] { --step-color: #8b5cf6; }
    .step[data-type="if"] { --step-color: #d946ef; }
    .step[data-type="run_for"], .step[data-type="run_until"] { --step-color: #f59e0b; }
    .step[data-type="script"] { --step-color: #3b82f6; }
    .step[data-type="ocr_text"] { --step-color: #14b8a6; }
    .step[data-type="template_match"] { --step-color: #22c55e; }
    .step[data-type="skill_check"] { --step-color: #84cc16; }
    .step[data-type="circle_percentage"] { --step-color: #06b6d4; }
    .step[data-type="tap"] { --step-color: #ef4444; }
    .step[data-type="wait"] { --step-color: #f97316; }
    .step[data-type="break"] { --step-color: #e11d48; }
    .step[data-type="continue"] { --step-color: #6366f1; }
    .step[data-type="return"] { --step-color: #94a3b8; }
    .step.drop-before { box-shadow: 0 -3px 0 var(--accent); }
    .step-head { display: flex; align-items: center; gap: 6px; min-height: 30px; }
    .step-index { width: 30px; flex: 0 0 30px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    .drag-handle { cursor: grab; color: var(--muted); user-select: none; padding: 2px 4px; }
    .step-summary { flex: 1; min-width: 0; }
    .step-primary { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .step-label {
      min-width: 0; flex: 0 1 auto; color: var(--text); font-size: 13px; font-weight: 650;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .step-name { flex: 0 0 auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .step-type { flex: 0 0 auto; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .step-branches { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .branch-button { padding: 3px 7px; color: var(--muted); font-size: 11px; background: var(--bg); }
    .step-actions {
      display: flex; gap: 4px; margin-left: auto; opacity: 0; visibility: hidden;
      pointer-events: none; transition: opacity .12s ease;
    }
    .step-head:hover .step-actions,
    .step:focus > .step-head .step-actions,
    .step-head:focus-within .step-actions {
      opacity: 1; visibility: visible; pointer-events: auto;
    }
    .icon { padding: 2px 7px; min-width: 27px; }
    .delete { color: var(--danger); }
    .drop-zone {
      min-height: 34px; display: grid; place-items: center; border: 1px dashed var(--line);
      border-radius: 7px; color: var(--muted); font-size: 12px; text-align: center; padding: 6px;
    }
    .drop-zone.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .inspector-step { margin-bottom: 14px; }
    .inspector-name { font-weight: 650; }
    .inspector-type { margin-left: 6px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .parameter-field { margin-bottom: 12px; }
    .parameter-field label { overflow-wrap: anywhere; }
    .parameter-control:not([type="checkbox"]) {
      width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px;
      background: var(--bg); color: var(--text);
    }
    textarea.parameter-control { min-height: 70px; resize: vertical; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .json-panel { grid-column: 1 / -1; }
    @media (max-width: 1000px) {
      main { --outline-width: 220px; }
      main, main.json-visible { grid-template-columns: var(--outline-width) minmax(300px, 1fr) 260px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="workflow-heading">
      <h1>v3 Workflow Orchestrator</h1>
      <div id="workflowLabel" hidden></div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Workflow actions">
      <button id="newButton">New</button>
      <button id="openButton">Open…</button>
      <button id="saveButton" class="primary">Save</button>
      <button id="saveAsButton">Save As…</button>
      <button id="toggleJsonButton" aria-controls="jsonPanel" aria-expanded="false">Show JSON</button>
    </div>
    <div id="status" role="status" aria-live="polite">Ready</div>
  </header>
  <main>
    <aside class="panel outline-panel" aria-labelledby="outlineTitle">
      <h2 id="outlineTitle" class="panel-title">Flow Outline</h2>
      <div class="outline-tools">
        <label for="outlineSearch" class="sr-only">Find steps</label>
        <input id="outlineSearch" type="search" placeholder="Find steps…">
        <button id="collapseAllButton" type="button">Collapse all</button>
      </div>
      <div id="outlineScroll" class="scroll"><div id="outline"></div></div>
      <div id="outlineResizer" class="outline-resizer" role="separator" aria-label="Resize Flow Outline" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="600" tabindex="0"></div>
    </aside>
    <section class="panel" aria-labelledby="canvasTitle">
      <div class="panel-title scope-header">
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Current workflow scope"></nav>
        <div class="scope-add">
          <label for="addType" class="sr-only">Step type</label>
          <select id="addType"></select>
          <button id="addStepButton" type="button">Add step</button>
        </div>
      </div>
      <h2 id="canvasTitle" class="sr-only">Focused Steps</h2>
      <div id="canvasScroll" class="scroll"><div id="canvas"></div></div>
    </section>
    <aside class="panel" aria-labelledby="inspectorTitle">
      <h2 id="inspectorTitle" class="panel-title">Inspector</h2>
      <div id="inspectorScroll" class="scroll">
        <p id="inspectorEmpty" class="hint">Select a step or Variables from the outline.</p>
        <div id="inspectorContent" hidden>
          <div class="inspector-step">
            <span id="inspectorName" class="inspector-name"></span>
            <span id="inspectorType" class="inspector-type"></span>
          </div>
          <form id="inspectorForm"></form>
        </div>
        <div id="variablesContent" hidden>
          <label for="varsEditor">Variables (JSON object)</label>
          <textarea id="varsEditor" spellcheck="false"></textarea>
          <button id="applyVarsButton" type="button">Apply variables</button>
        </div>
      </div>
    </aside>
    <section id="jsonPanel" class="panel json-panel" aria-labelledby="jsonTitle" hidden>
      <h2 id="jsonTitle" class="panel-title">JSON DSL</h2>
      <label for="jsonEditor" style="position:absolute;left:-10000px">Complete v3 JSON</label>
      <textarea id="jsonEditor" spellcheck="false"></textarea>
      <div class="json-actions">
        <button id="applyJsonButton">Apply to canvas</button>
        <button id="formatButton">Format</button>
        <button id="validateButton">Validate</button>
      </div>
    </section>
  </main>
  <script>
    'use strict';

    const templates = {
      assign: { type: 'assign', target: '${counter}', value: '${counter + 1}' },
      while: { type: 'while', condition: '${counter < 1}', steps: [] },
      if: { type: 'if', condition: true, then: [], else: [] },
      run_for: { type: 'run_for', duration_ms: 16000, steps: [] },
      run_until: { type: 'run_until', check_every_ms: 500, timeout_ms: 30000, check: [], until: true, steps: [] },
      script: { type: 'script', script_name: 'child.json' },
      ocr_text: { type: 'ocr_text', roi: [0, 0, 100, 100], output: '${text}' },
      template_match: { type: 'template_match', roi: [0, 0, 100, 100], template: 'button.png', threshold: 0.8, output: '${result}' },
      skill_check: { type: 'skill_check', roi: [0, 0, 100, 100], model: 'model.onnx', skill: 'skill', threshold: 0.8, output: '${result}' },
      circle_percentage: { type: 'circle_percentage', roi: [0, 0, 100, 100], profile: 'default', output: '${result}' },
      tap: { type: 'tap', point: [100, 100], duration_ms: 100 },
      wait: { type: 'wait', wait_ms: 500 },
      break: { type: 'break' },
      continue: { type: 'continue' },
      return: { type: 'return' }
    };
    const titles = {
      assign: 'Assignment', while: 'Loop', if: 'Condition', run_for: 'Run For', run_until: 'Run Until', script: 'Subflow',
      ocr_text: 'OCR Text', template_match: 'Template Match', skill_check: 'Skill Check',
      circle_percentage: 'Circle Percentage', tap: 'Tap', wait: 'Wait', break: 'Break',
      continue: 'Continue', return: 'Return'
    };
    const nestedKeys = { while: ['steps'], if: ['then', 'else'], run_for: ['steps'], run_until: ['steps', 'check'] };
    const nestedTitles = { steps: 'Steps', then: 'Then', else: 'Else', check: 'Check' };

    function copy(value) { return JSON.parse(JSON.stringify(value)); }
    function newDocument() {
      return { version: 3, vars: { counter: 0, text: '', result: null }, steps: [] };
    }
    function cloneTemplate(type) { return copy(templates[type]); }

    // Fail early if the visual palette drifts away from the v3 parser command set.
    const expectedKinds = ['assign', 'while', 'if', 'run_for', 'run_until', 'script', 'ocr_text', 'template_match',
      'skill_check', 'circle_percentage', 'tap', 'wait', 'break', 'continue', 'return'];
    if (expectedKinds.some(kind => !templates[kind]) || Object.keys(templates).length !== expectedKinds.length) {
      throw new Error('v3 command palette is incomplete');
    }
    const copyCheck = cloneTemplate('while');
    copyCheck.steps.push(cloneTemplate('wait'));
    if (templates.while.steps.length !== 0) throw new Error('command templates share mutable state');

    let workflow = newDocument();
    let dragState = null;
    let selectedStep = null;
    let inspectorMode = null;
    let scopeStack = [];
    let expandedSteps = new WeakSet();
    let dirty = false;
    const canvas = document.getElementById('canvas');
    const canvasScroll = document.getElementById('canvasScroll');
    const outline = document.getElementById('outline');
    const outlineScroll = document.getElementById('outlineScroll');
    const outlineSearch = document.getElementById('outlineSearch');
    const main = document.querySelector('main');
    const outlinePanel = document.querySelector('.outline-panel');
    const outlineResizer = document.getElementById('outlineResizer');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const addType = document.getElementById('addType');
    const varsEditor = document.getElementById('varsEditor');
    const jsonEditor = document.getElementById('jsonEditor');
    const jsonPanel = document.getElementById('jsonPanel');
    const workflowLabel = document.getElementById('workflowLabel');
    const inspectorEmpty = document.getElementById('inspectorEmpty');
    const inspectorContent = document.getElementById('inspectorContent');
    const inspectorName = document.getElementById('inspectorName');
    const inspectorType = document.getElementById('inspectorType');
    const inspectorForm = document.getElementById('inspectorForm');
    const variablesContent = document.getElementById('variablesContent');
    const status = document.getElementById('status');
    let outlineResize = null;

    function outlineWidthBounds() {
      const reservedWidth = window.matchMedia('(max-width: 1000px)').matches ? 600 : 660;
      return { min: 180, max: Math.max(180, Math.min(600, main.clientWidth - reservedWidth)) };
    }

    function setOutlineWidth(width) {
      const bounds = outlineWidthBounds();
      const next = Math.round(Math.max(bounds.min, Math.min(bounds.max, width)));
      main.style.setProperty('--outline-width', `${next}px`);
      outlineResizer.setAttribute('aria-valuemax', String(bounds.max));
      outlineResizer.setAttribute('aria-valuenow', String(next));
    }

    function currentOutlineWidth() {
      return outlinePanel.getBoundingClientRect().width;
    }

    function nativeMessage(action, extra = {}) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.orchestration) {
        window.webkit.messageHandlers.orchestration.postMessage({ action, ...extra });
      } else {
        showStatus('File operations are only available in the Adb Quick app.', true);
      }
    }

    function showStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle('error', Boolean(isError));
    }

    function renderCommandOptions() {
      for (const type of expectedKinds) {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        addType.appendChild(option);
      }
    }

    function resetEditorView() {
      selectedStep = null;
      inspectorMode = null;
      scopeStack = [{ owner: null, key: null, list: workflow.steps }];
      expandedSteps = new WeakSet();
    }

    function currentScope() {
      return scopeStack[scopeStack.length - 1];
    }

    function makeScope(step, key) {
      if (!Array.isArray(step[key])) step[key] = [];
      return { owner: step, key, list: step[key] };
    }

    function stepTitle(step) {
      const label = typeof step.label === 'string' ? step.label.trim() : '';
      return label || titles[step.type] || step.type || 'Unknown command';
    }

    function scopeTitle(scope) {
      return scope.owner ? `${stepTitle(scope.owner)} · ${nestedTitles[scope.key]}` : 'Root';
    }

    function renderAll(resetCanvas = false) {
      const canvasTop = resetCanvas ? 0 : canvasScroll.scrollTop;
      const outlineTop = outlineScroll.scrollTop;
      const label = typeof workflow.label === 'string' ? workflow.label.trim() : '';
      workflowLabel.textContent = label;
      workflowLabel.hidden = !label;
      varsEditor.value = JSON.stringify(workflow.vars, null, 2);
      renderBreadcrumbs();
      canvas.replaceChildren();
      renderList(currentScope().list, canvas);
      renderOutline();
      renderInspector();
      jsonEditor.value = JSON.stringify(workflow, null, 2);
      canvasScroll.scrollTop = canvasTop;
      outlineScroll.scrollTop = outlineTop;
    }

    function renderBreadcrumbs() {
      breadcrumbs.replaceChildren();
      scopeStack.forEach((scope, index) => {
        if (index) {
          const separator = document.createElement('span');
          separator.className = 'breadcrumb-separator';
          separator.textContent = '/';
          breadcrumbs.appendChild(separator);
        }
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'breadcrumb';
        button.textContent = scopeTitle(scope);
        button.disabled = index === scopeStack.length - 1;
        button.addEventListener('click', () => {
          scopeStack = scopeStack.slice(0, index + 1);
          selectedStep = null;
          inspectorMode = null;
          renderAll(true);
        });
        breadcrumbs.appendChild(button);
      });
    }

    function renderList(list, host) {
      const root = document.createElement('div');
      root.className = 'step-list';
      list.forEach((step, index) => root.appendChild(renderStep(step, list, index)));

      const dropZone = document.createElement('div');
      dropZone.className = 'drop-zone';
      dropZone.tabIndex = 0;
      dropZone.textContent = list.length ? 'Drop here to append a step' : 'Add a step to this scope';
      dropZone.addEventListener('dragover', allowDrop);
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
      dropZone.addEventListener('drop', event => dropAt(event, list, list.length));
      root.appendChild(dropZone);
      host.appendChild(root);
    }

    function renderStep(step, list, index) {
      const block = document.createElement('article');
      block.className = 'step';
      block.dataset.type = step.type || '';
      block.tabIndex = 0;
      block.classList.toggle('selected', selectedStep === step);
      if (selectedStep === step) block.setAttribute('aria-current', 'step');
      block.addEventListener('click', event => {
        event.stopPropagation();
        selectStep(step);
      });
      block.addEventListener('keydown', event => {
        if (event.target !== block || (event.key !== 'Enter' && event.key !== ' ')) return;
        event.preventDefault();
        selectStep(step);
      });
      block.addEventListener('dragover', event => {
        allowDrop(event);
        block.classList.add('drop-before');
      });
      block.addEventListener('dragleave', () => block.classList.remove('drop-before'));
      block.addEventListener('drop', event => dropAt(event, list, index));

      const head = document.createElement('div');
      head.className = 'step-head';
      const position = document.createElement('span');
      position.className = 'step-index';
      position.textContent = String(index + 1);
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag step';
      handle.tabIndex = 0;
      handle.draggable = true;
      handle.addEventListener('dragstart', event => {
        event.stopPropagation();
        dragState = { kind: 'step', list, index, step };
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', step.type || 'step');
      });
      handle.addEventListener('dragend', () => { dragState = null; clearDropMarks(); });

      const name = document.createElement('span');
      name.className = 'step-name';
      name.textContent = titles[step.type] || 'Unknown command';
      const type = document.createElement('span');
      type.className = 'step-type';
      type.textContent = step.type || '(missing type)';
      const summary = document.createElement('div');
      summary.className = 'step-summary';
      const primary = document.createElement('div');
      primary.className = 'step-primary';
      if (typeof step.label === 'string' && step.label.trim()) {
        const label = document.createElement('span');
        label.className = 'step-label';
        label.textContent = step.label.trim();
        label.title = label.textContent;
        primary.appendChild(label);
      }
      primary.append(name, type);
      summary.appendChild(primary);
      const branches = document.createElement('div');
      branches.className = 'step-branches';
      for (const key of nestedKeys[step.type] || []) {
        const childScope = makeScope(step, key);
        const branch = document.createElement('button');
        branch.type = 'button';
        branch.className = 'branch-button';
        branch.textContent = `${nestedTitles[key]} ${childScope.list.length}`;
        branch.addEventListener('click', event => {
          event.stopPropagation();
          scopeStack.push(childScope);
          selectedStep = null;
          inspectorMode = null;
          renderAll(true);
        });
        branches.appendChild(branch);
      }
      const actions = document.createElement('div');
      actions.className = 'step-actions';
      actions.append(moveButton('↑', 'Move up', () => moveWithin(list, index, index - 1), index === 0));
      actions.append(moveButton('↓', 'Move down', () => moveWithin(list, index, index + 1), index === list.length - 1));
      const remove = moveButton('×', 'Delete', () => {
        if (selectedStep === step) selectedStep = null;
        list.splice(index, 1);
        dirty = true;
        renderAll();
      }, false);
      remove.classList.add('delete');
      actions.append(remove);
      head.append(position, handle, summary, branches, actions);
      block.appendChild(head);
      return block;
    }

    function renderOutline() {
      outline.replaceChildren();
      const query = outlineSearch.value.trim().toLowerCase();
      if (query) {
        const results = [];
        collectSearchResults(workflow.steps, [scopeStack[0]], results, query);
        if (!results.length) {
          const empty = document.createElement('p');
          empty.className = 'hint';
          empty.textContent = 'No matching steps.';
          outline.appendChild(empty);
          return;
        }
        for (const result of results) outline.appendChild(renderSearchResult(result));
        return;
      }

      const tree = document.createElement('ul');
      tree.className = 'outline-list';
      const variables = document.createElement('li');
      const variablesRow = document.createElement('div');
      variablesRow.className = 'outline-row';
      variablesRow.classList.toggle('selected', inspectorMode === 'variables');
      const spacer = document.createElement('span');
      spacer.className = 'outline-spacer';
      const variablesButton = document.createElement('button');
      variablesButton.type = 'button';
      variablesButton.className = 'outline-vars';
      variablesButton.textContent = 'Variables';
      variablesButton.addEventListener('click', () => {
        selectedStep = null;
        inspectorMode = 'variables';
        renderAll();
      });
      variablesRow.append(spacer, variablesButton);
      variables.appendChild(variablesRow);
      tree.appendChild(variables);
      renderOutlineList(workflow.steps, tree, [scopeStack[0]]);
      outline.appendChild(tree);
    }

    function renderOutlineList(list, host, scopes) {
      list.forEach(step => {
        const item = document.createElement('li');
        const row = document.createElement('div');
        row.className = 'outline-row';
        row.classList.toggle('selected', selectedStep === step);
        const keys = nestedKeys[step.type] || [];
        if (keys.length) {
          const disclosure = document.createElement('button');
          disclosure.type = 'button';
          disclosure.className = 'outline-disclosure';
          setDisclosureIcon(disclosure, expandedSteps.has(step));
          disclosure.title = expandedSteps.has(step) ? 'Collapse branches' : 'Expand branches';
          disclosure.setAttribute('aria-label', disclosure.title);
          disclosure.setAttribute('aria-expanded', String(expandedSteps.has(step)));
          disclosure.addEventListener('click', () => {
            if (expandedSteps.has(step)) expandedSteps.delete(step);
            else expandedSteps.add(step);
            renderOutline();
          });
          row.appendChild(disclosure);
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'outline-spacer';
          row.appendChild(spacer);
        }
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'outline-node';
        button.textContent = stepTitle(step);
        button.title = step.type || 'Unknown command';
        button.addEventListener('click', () => {
          scopeStack = scopes.slice();
          selectedStep = step;
          inspectorMode = 'step';
          renderAll(true);
        });
        row.appendChild(button);
        const count = descendantCount(step);
        if (count) {
          const badge = document.createElement('span');
          badge.className = 'outline-count';
          badge.textContent = String(count);
          badge.title = `${count} nested step${count === 1 ? '' : 's'}`;
          row.appendChild(badge);
        }
        item.appendChild(row);

        if (keys.length && expandedSteps.has(step)) {
          const branches = document.createElement('ul');
          for (const key of keys) {
            const childScope = makeScope(step, key);
            const branchItem = document.createElement('li');
            const branchRow = document.createElement('div');
            branchRow.className = 'outline-row';
            branchRow.classList.toggle('selected', currentScope().list === childScope.list);
            const branchSpacer = document.createElement('span');
            branchSpacer.className = 'outline-spacer';
            const branchButton = document.createElement('button');
            branchButton.type = 'button';
            branchButton.className = 'outline-branch';
            branchButton.textContent = `${nestedTitles[key]} (${childScope.list.length})`;
            const childScopes = [...scopes, childScope];
            branchButton.addEventListener('click', () => {
              scopeStack = childScopes;
              selectedStep = null;
              inspectorMode = null;
              renderAll(true);
            });
            branchRow.append(branchSpacer, branchButton);
            branchItem.appendChild(branchRow);
            if (childScope.list.length) {
              const childList = document.createElement('ul');
              renderOutlineList(childScope.list, childList, childScopes);
              branchItem.appendChild(childList);
            }
            branches.appendChild(branchItem);
          }
          item.appendChild(branches);
        }
        host.appendChild(item);
      });
    }

    function descendantCount(step) {
      let count = 0;
      for (const key of nestedKeys[step.type] || []) {
        const children = Array.isArray(step[key]) ? step[key] : [];
        count += children.length;
        for (const child of children) count += descendantCount(child);
      }
      return count;
    }

    function collectSearchResults(list, scopes, results, query) {
      for (const step of list) {
        const searchable = `${step.type || ''} ${stepTitle(step)} ${JSON.stringify(stepFields(step))}`.toLowerCase();
        if (searchable.includes(query)) results.push({ step, scopes: scopes.slice() });
        for (const key of nestedKeys[step.type] || []) {
          const childScope = makeScope(step, key);
          collectSearchResults(childScope.list, [...scopes, childScope], results, query);
        }
      }
    }

    function renderSearchResult(result) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'outline-node search-result';
      button.append(document.createTextNode(stepTitle(result.step)));
      const path = document.createElement('span');
      path.className = 'outline-path';
      path.textContent = result.scopes.map(scopeTitle).join(' / ');
      button.appendChild(path);
      button.addEventListener('click', () => {
        for (const scope of result.scopes) if (scope.owner) expandedSteps.add(scope.owner);
        scopeStack = result.scopes;
        selectedStep = result.step;
        inspectorMode = 'step';
        renderAll(true);
      });
      return button;
    }

    function setDisclosureIcon(button, expanded) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', expanded ? 'm6 9 6 6 6-6' : 'm9 18 6-6-6-6');
      svg.appendChild(path);
      button.replaceChildren(svg);
    }

    function moveButton(text, title, action, disabled) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'icon';
      button.textContent = text;
      button.title = title;
      button.setAttribute('aria-label', title);
      button.disabled = disabled;
      button.addEventListener('click', event => {
        event.stopPropagation();
        action();
      });
      return button;
    }

    function stepFields(step) {
      const result = {};
      const children = new Set(nestedKeys[step.type] || []);
      for (const [key, value] of Object.entries(step)) {
        if (key !== 'type' && !children.has(key)) result[key] = value;
      }
      return result;
    }

    function selectStep(step) {
      selectedStep = step;
      inspectorMode = 'step';
      renderAll();
    }

    function renderInspector() {
      inspectorForm.replaceChildren();
      const showStep = inspectorMode === 'step' && Boolean(selectedStep);
      const showVariables = inspectorMode === 'variables';
      inspectorEmpty.hidden = showStep || showVariables;
      inspectorContent.hidden = !showStep;
      variablesContent.hidden = !showVariables;
      if (!showStep) return;

      inspectorName.textContent = titles[selectedStep.type] || 'Unknown command';
      inspectorType.textContent = selectedStep.type || '(missing type)';
      const fields = stepFields(selectedStep);
      const entries = Object.entries(fields);
      if (!Object.prototype.hasOwnProperty.call(fields, 'label')) entries.unshift(['label', '']);

      entries.forEach(([key, value], index) => {
        const field = document.createElement('div');
        field.className = 'parameter-field';
        const label = document.createElement('label');
        const control = createParameterControl(value);
        control.id = `parameter-${index}`;
        control.classList.add('parameter-control');
        label.htmlFor = control.id;
        label.textContent = key;
        control.addEventListener('change', () => updateParameter(key, value, control));
        field.append(label, control);
        inspectorForm.appendChild(field);
      });
    }

    function createParameterControl(value) {
      if (typeof value === 'boolean') {
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = value;
        return input;
      }
      if (Array.isArray(value) || (value !== null && typeof value === 'object') || value === null) {
        const textarea = document.createElement('textarea');
        textarea.spellcheck = false;
        textarea.value = JSON.stringify(value, null, 2);
        return textarea;
      }
      const input = document.createElement('input');
      input.type = typeof value === 'number' ? 'number' : 'text';
      if (typeof value === 'number') input.step = 'any';
      input.value = String(value);
      return input;
    }

    function readParameterValue(control, original) {
      if (typeof original === 'boolean') return control.checked;
      if (typeof original === 'number') {
        const value = Number(control.value);
        if (!control.value.trim() || !Number.isFinite(value)) throw new Error('Enter a valid number');
        return value;
      }
      if (typeof original === 'string') return control.value;
      const value = JSON.parse(control.value);
      if (Array.isArray(original) && !Array.isArray(value)) throw new Error('Enter a JSON array');
      if (!Array.isArray(original) && original !== null && typeof original === 'object' &&
          (!value || Array.isArray(value) || typeof value !== 'object')) {
        throw new Error('Enter a JSON object');
      }
      return value;
    }

    function updateParameter(key, original, control) {
      try {
        const value = readParameterValue(control, original);
        if (key === 'label' && typeof value === 'string' && !value.trim()) delete selectedStep.label;
        else selectedStep[key] = value;
        dirty = true;
        renderAll();
        showStatus(`Updated ${selectedStep.type}`);
      } catch (error) {
        showStatus(`Invalid ${key}: ${error.message}`, true);
      }
    }

    function addStep() {
      const step = cloneTemplate(addType.value);
      currentScope().list.push(step);
      selectedStep = step;
      inspectorMode = 'step';
      dirty = true;
      renderAll();
      canvasScroll.scrollTop = canvasScroll.scrollHeight;
      showStatus(`Added ${step.type}`);
    }

    function moveWithin(list, from, to) {
      if (to < 0 || to >= list.length) return;
      const [step] = list.splice(from, 1);
      list.splice(to, 0, step);
      dirty = true;
      renderAll();
    }

    function allowDrop(event) {
      if (!dragState) return;
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget.classList.add(event.currentTarget.classList.contains('step') ? 'drop-before' : 'active');
      event.dataTransfer.dropEffect = 'move';
    }

    function dropAt(event, targetList, targetIndex) {
      event.preventDefault();
      event.stopPropagation();
      if (!dragState) return;
      if (dragState.list !== targetList) {
        showStatus('Drag reordering stays within the current scope.', true);
        clearDropMarks();
        return;
      }
      const sourceIndex = dragState.index;
      const [step] = targetList.splice(sourceIndex, 1);
      if (sourceIndex < targetIndex) targetIndex -= 1;
      targetList.splice(targetIndex, 0, step);
      dragState = null;
      dirty = true;
      renderAll();
      showStatus('Updated step order');
    }

    function clearDropMarks() {
      document.querySelectorAll('.active, .drop-before').forEach(node => node.classList.remove('active', 'drop-before'));
    }

    function applyVariables() {
      try {
        const value = JSON.parse(varsEditor.value);
        if (!value || Array.isArray(value) || typeof value !== 'object') throw new Error('vars must be a JSON object');
        workflow.vars = value;
        dirty = true;
        renderAll();
        showStatus('Applied variables');
      } catch (error) {
        showStatus(`Invalid variables JSON: ${error.message}`, true);
      }
    }

    function applyJSON(validate = true) {
      try {
        const value = JSON.parse(jsonEditor.value);
        if (!value || Array.isArray(value) || typeof value !== 'object') throw new Error('The root must be a JSON object');
        if (value.version !== 3) throw new Error('version must be 3');
        if (!value.vars || Array.isArray(value.vars) || typeof value.vars !== 'object') throw new Error('vars must be a JSON object');
        if (!Array.isArray(value.steps)) throw new Error('steps must be an array');
        workflow = value;
        resetEditorView();
        renderAll(true);
        showStatus('Applied JSON to the editor');
        if (validate) nativeMessage('validate', { json: jsonEditor.value });
        return true;
      } catch (error) {
        showStatus(`Invalid JSON: ${error.message}`, true);
        return false;
      }
    }

    function loadDocument(source) {
      jsonEditor.value = source;
      if (applyJSON(false)) dirty = false;
    }

    function markSaved() {
      dirty = false;
    }

    function canDiscardChanges() {
      return !dirty || window.confirm('The current workflow has unsaved changes.');
    }

    document.getElementById('newButton').addEventListener('click', () => {
      if (!canDiscardChanges()) return;
      workflow = newDocument();
      resetEditorView();
      dirty = false;
      renderAll(true);
      nativeMessage('new');
      showStatus('Created a new workflow');
    });
    document.getElementById('openButton').addEventListener('click', () => {
      if (canDiscardChanges()) nativeMessage('open');
    });
    document.getElementById('saveButton').addEventListener('click', () => nativeMessage('save', { json: jsonEditor.value }));
    document.getElementById('saveAsButton').addEventListener('click', () => nativeMessage('saveAs', { json: jsonEditor.value }));
    document.getElementById('toggleJsonButton').addEventListener('click', event => {
      const show = jsonPanel.hidden;
      jsonPanel.hidden = !show;
      document.querySelector('main').classList.toggle('json-visible', show);
      event.currentTarget.textContent = show ? 'Hide JSON' : 'Show JSON';
      event.currentTarget.setAttribute('aria-expanded', String(show));
    });
    document.getElementById('addStepButton').addEventListener('click', addStep);
    document.getElementById('collapseAllButton').addEventListener('click', () => {
      expandedSteps = new WeakSet();
      renderOutline();
    });
    outlineResizer.addEventListener('pointerdown', event => {
      event.preventDefault();
      outlineResize = { x: event.clientX, width: currentOutlineWidth() };
      main.classList.add('resizing');
      outlineResizer.setPointerCapture(event.pointerId);
    });
    outlineResizer.addEventListener('pointermove', event => {
      if (outlineResize) setOutlineWidth(outlineResize.width + event.clientX - outlineResize.x);
    });
    function finishOutlineResize() {
      outlineResize = null;
      main.classList.remove('resizing');
    }
    outlineResizer.addEventListener('pointerup', finishOutlineResize);
    outlineResizer.addEventListener('pointercancel', finishOutlineResize);
    outlineResizer.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      setOutlineWidth(currentOutlineWidth() + (event.key === 'ArrowLeft' ? -20 : 20));
    });
    window.addEventListener('resize', () => {
      if (main.style.getPropertyValue('--outline-width')) setOutlineWidth(currentOutlineWidth());
    });
    outlineSearch.addEventListener('input', renderOutline);
    document.getElementById('applyVarsButton').addEventListener('click', applyVariables);
    document.getElementById('applyJsonButton').addEventListener('click', () => applyJSON(true));
    document.getElementById('formatButton').addEventListener('click', () => {
      try {
        jsonEditor.value = JSON.stringify(JSON.parse(jsonEditor.value), null, 2);
        dirty = true;
        showStatus('Formatted JSON');
      } catch (error) { showStatus(`Invalid JSON: ${error.message}`, true); }
    });
    document.getElementById('validateButton').addEventListener('click', () => nativeMessage('validate', { json: jsonEditor.value }));
    varsEditor.addEventListener('input', () => { dirty = true; });
    jsonEditor.addEventListener('input', () => { dirty = true; });
    inspectorForm.addEventListener('submit', event => event.preventDefault());

    if (readParameterValue({ value: '2.5' }, 1) !== 2.5 ||
        !Array.isArray(readParameterValue({ value: '[1, 2]' }, []))) {
      throw new Error('parameter form does not preserve JSON value types');
    }
    const scopeCheck = cloneTemplate('if');
    scopeCheck.then.push(cloneTemplate('tap'));
    if (descendantCount(scopeCheck) !== 1 || makeScope(scopeCheck, 'then').list[0].type !== 'tap') {
      throw new Error('focused scope navigation is inconsistent');
    }

    renderCommandOptions();
    resetEditorView();
    renderAll();
    outlineResizer.setAttribute('aria-valuenow', String(Math.round(currentOutlineWidth())));
  </script>
</body>
</html>
